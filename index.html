<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BEDMAS Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #eef2f3; margin: 0; }
    .calculator { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 320px; text-align: center; }
    h2 { color: #333; margin-top: 0; }
    input { width: 100%; height: 45px; font-size: 18px; margin-bottom: 15px; padding: 10px; box-sizing: border-box; border: 2px solid #ddd; border-radius: 6px; }
    button { width: 100%; height: 45px; font-size: 16px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .result { margin-top: 20px; font-size: 20px; font-weight: bold; color: #28a745; word-wrap: break-word; }
    p { font-size: 12px; color: #777; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="calculator">
    <h2>BEDMAS Calculator</h2>
    <p>Use <b>^</b> for Exponents (e.g., 2^3). Use brackets () for Brackets.</p>
    <input type="text" id="expression" placeholder="e.g. 10 + (2 ^ 3) * 4" />
    <button onclick="calculateBEDMAS()">Calculate</button>
    <div class="result" id="output">Result: </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
